name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  # ── Firebase Hosting (Google auth fonctionnelle) ───────────────────────────
  deploy-firebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web (base-href /)
        run: flutter build web

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting + Firestore rules
        run: firebase deploy --only hosting,firestore:rules --token "$FIREBASE_TOKEN" --project dart-8a4d6 --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  # ── GitHub Pages (auth Google non fonctionnelle sur cet hébergeur) ─────────
  deploy-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web (base-href /darts/)
        run: flutter build web --base-href /darts/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - uses: actions/deploy-pages@v4
        id: deployment
