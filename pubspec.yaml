name: darts
description: "Darts scoring app — 301 double-out, multi-platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  hive_flutter: ^1.1.0
  fl_chart: ^0.69.0
  google_fonts: ^6.2.1
  path_provider: ^2.1.4
  intl: ^0.20.2
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  confetti: ^0.7.0
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1
  hive_generator: ^2.0.1

flutter:
  generate: true
  uses-material-design: true
